name: Build and Package

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Archive Project
        # 将整个目录打包，包含 node_modules
        run: tar -czf iptv-app.tar.gz --exclude=.git --exclude=.github .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-package
          path: iptv-app.tar.gz
