name: Build and Package

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Archive Project
        run: |
          # 1. 创建临时目录
          mkdir temp_build
          # 2. 将所有需要的文件复制到临时目录，排除 .git, .github 和 temp_build 本身
          find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name '.github' -not -name 'temp_build' -exec cp -r {} temp_build/ \;
          # 3. 在临时目录中创建压缩包，输出到当前根目录
          tar -czf iptv-app.tar.gz -C temp_build .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-package
          # 使用相对于工作空间根目录的路径，不再使用 ../
          path: iptv-app.tar.gz
