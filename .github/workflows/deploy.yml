name: Build and Package

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Archive Project
        # 将压缩包生成在工作目录之外，避免 tar 在读取当前目录时因为写入压缩包而报错
        run: tar -czf ../iptv-app.tar.gz --exclude=.git --exclude=.github --exclude=../iptv-app.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-package
          # 指向上一级目录中生成的压缩包
          path: ../iptv-app.tar.gz
